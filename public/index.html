<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GCSPL Auction</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hind:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}

/* Layout: one fixed screen. Host | lot | bid on top, ten team tiles, one action bar. Everything else lives in the side menu. */
:root{
  --bg:#0a0f1e; --panel:#121a30; --panel2:#18233f; --line:#26335a;
  --fg:#eef1fa; --mute:#8d9ac0; --gold:#f2b632; --gold-ink:#2a1d00;
  --good:#3ddc97; --bad:#ff5d6c; --warn:#ffb86b;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Hind','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.35;overflow-x:hidden;
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(1100px 420px at 50% -10%,#1b2a55 0%,transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.top{display:flex;align-items:center;gap:10px;flex:none}
.top h1{margin:0;font:800 24px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.top h1 b{color:var(--gold)}
.sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 0 3px #3ddc9733}
.dot.err{background:var(--bad)}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{width:42px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:grid;place-content:center;gap:4px;flex:none}
.menu i{display:block;width:20px;height:2px;background:var(--fg);border-radius:2px}
.menu:hover{border-color:var(--gold)}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) minmax(270px,360px);gap:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;min-height:0;overflow:hidden}
.host{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(180deg,#1a2548,var(--panel))}
.host svg{width:min(100%,170px);flex:1;min-height:0}
.mouth{transform-origin:80px 113px;transform-box:view-box}
.talk .mouth{animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.5)}}
.eye{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.gavel{transform-origin:150px 190px;transform-box:view-box}
.hit .gavel{animation:hit .5s 2}
@keyframes hit{0%{transform:rotate(0)}45%{transform:rotate(-38deg)}70%{transform:rotate(8deg)}100%{transform:rotate(0)}}
.bubble{position:relative;background:var(--fg);color:#0b1226;border-radius:8px;padding:7px 10px;font-weight:500;font-size:13px;width:100%;max-height:5.6em;overflow:hidden;flex:none}
.lot{display:flex;flex-direction:column;gap:12px;justify-content:center}
.lotset{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.pname{font:800 clamp(30px,min(7vw,11vh),84px)/.95 var(--display);text-transform:uppercase;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:2px 10px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:600;letter-spacing:.04em}
.tag.os{color:var(--warn);border-color:#5b4630}.tag.in{color:var(--good);border-color:#255a47}
.base{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.base small{color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.base strong{font:800 clamp(26px,5vh,38px) var(--display);color:var(--gold)}
.pop{animation:pop .4s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.2}to{transform:none;opacity:1}}
.empty{display:flex;flex-direction:column;gap:6px;justify-content:center;height:100%;color:var(--mute);font-size:14px}
.empty b{font:800 clamp(24px,4.5vh,32px) var(--display);color:var(--fg);text-transform:uppercase}
.bidbox{display:flex;flex-direction:column;gap:6px;justify-content:center}
.bidtop{display:flex;gap:12px;align-items:center}
.ring{position:relative;width:clamp(70px,13vh,104px);aspect-ratio:1;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(26px,5vh,36px) var(--display)}
.cur{min-width:0}
.cur small{display:block;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.cur strong{font:800 clamp(34px,min(7vh,8vw),56px)/1 var(--display);color:var(--gold);display:block}
.leader{display:inline-flex;gap:8px;align-items:center;margin-top:2px;font-weight:600;font-size:14px}
.status{font:800 clamp(18px,3.4vh,24px) var(--display);letter-spacing:.08em;text-transform:uppercase;min-height:1.2em}
.status.once{color:var(--warn)}.status.twice{color:var(--bad)}
.bidlog{display:flex;gap:5px;overflow:hidden;white-space:nowrap}
.bl{font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);flex:none}
.incnote{color:var(--mute);font-size:12px}
.badge{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font:800 9.5px var(--display);color:#0b0f1e;flex:none;overflow:hidden}
.paddles{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;flex:none}
.pad{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:8px;padding:6px 8px;min-width:0;position:relative}
.pad:hover:not(.lock):not(.lead){background:var(--panel2);border-color:var(--tc)}
.pad .r1{display:flex;align-items:center;gap:6px;min-width:0}
.pad .nm{font:800 18px/1 var(--display);letter-spacing:.04em}
.pad .ow{color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pad .pu{font-weight:600;font-size:13px}
.pad .ct{font-size:11px;color:var(--mute)}
.pad .st{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);min-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad.lock{opacity:.5}
.pad.lead{background:var(--tc);color:#0b0f1e}
.pad.lead .ow,.pad.lead .st,.pad.lead .ct{color:#0b0f1e}
.pad.lead .badge{background:#0b0f1e;color:var(--tc)}
.pad.me{outline:2px solid var(--gold);outline-offset:1px}
.pad.on::after{content:"";position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--good)}
.pad.ai::before{content:"AI";position:absolute;right:6px;bottom:4px;font-size:9px;font-weight:700;color:var(--gold)}
.bar{display:flex;flex-wrap:wrap;gap:6px;flex:none}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 14px;font-weight:600;letter-spacing:.03em;min-height:40px}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font:800 19px var(--display);letter-spacing:.06em;text-transform:uppercase}
.btn.sold{background:var(--good);color:#04251a;border-color:var(--good);font:800 19px var(--display);letter-spacing:.06em;text-transform:uppercase}
.btn.bad{color:var(--bad)}
.bar .big{flex:1 1 90px}.bar .small{flex:1 1 70px;font-size:13px;padding:6px 8px;min-height:34px}
.bidbtn{flex:1;min-height:54px;border-radius:10px;border:0;background:var(--tc,var(--gold));color:#0b0f1e;font:800 30px var(--display);letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.bidbtn small{font:500 12px var(--body);letter-spacing:.02em;text-transform:none}
.bidbtn:disabled{background:var(--panel2);color:var(--mute);cursor:not-allowed}
.bidbtn:active:not(:disabled){transform:scale(.99)}
/* drawer */
#scrim{position:fixed;inset:0;background:#050813aa;z-index:30}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:31;display:flex;flex-direction:column;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-10px 0 40px #0008}
#drawer[hidden],#scrim[hidden]{display:none}
.dh{display:flex;align-items:center;gap:8px;padding:0 12px 8px}
.dh h2{margin:0;font:800 22px var(--display);letter-spacing:.06em;text-transform:uppercase;flex:1}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 8px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:7px 10px;color:var(--mute);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
#dbody{flex:1;min-height:0;overflow:auto;padding:12px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tc{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.tc:hover{background:var(--panel2)}
.tc .h{display:flex;align-items:center;gap:8px}
.tc .h strong{font:800 20px var(--display);letter-spacing:.04em}
.tc .h .own{color:var(--mute);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc .purse{font:800 28px/1 var(--display);color:var(--gold)}
.tc .purse small{font:500 12px var(--body);color:var(--mute);margin-left:6px}
.meter{position:relative;height:9px;background:#0b1226;border-radius:5px;border:1px solid var(--line)}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--tc);border-radius:5px}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);left:calc(18/25*100%)}
.rrow{display:flex;gap:5px;flex-wrap:wrap}
.rc{font-size:12px;border-radius:4px;padding:1px 7px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.rc b{color:var(--fg);margin-left:3px}
.pill{font-size:11px;letter-spacing:.08em;font-weight:700;text-transform:uppercase;border-radius:4px;padding:1px 7px;flex:none}
.pill.red{background:#3b1520;color:var(--bad)}.pill.grn{background:#10382b;color:var(--good)}.pill.amb{background:#3a2c14;color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--mute);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid #1d2748}
.scroll{overflow-x:auto;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mute)}
.chip[aria-pressed="true"]{color:var(--gold-ink);background:var(--gold);border-color:var(--gold);font-weight:600}
input[type=search],select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;min-width:0}
.sqgrp h4{margin:10px 0 4px;font:800 17px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
textarea{width:100%;min-height:130px;background:#0b1226;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace}
.sec{margin:14px 0 6px;font:800 16px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.hint{color:var(--mute);font-size:12px;margin:4px 0}
#splash,#modal{position:fixed;inset:0;background:#050813ee;display:grid;place-items:center;z-index:50;padding:16px;overflow:auto}
#splash[hidden],#modal[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font:800 38px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.card h2 b{color:var(--gold)}
.card p{margin:0;color:var(--mute)}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pickb{display:flex;align-items:center;gap:8px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:8px;padding:8px 10px;min-width:0}
.pickb:disabled{opacity:.4;cursor:not-allowed}
.pickb[aria-pressed="true"]{background:var(--tc);color:#0b0f1e}
.pickb span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#soldov{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40;opacity:0;transition:opacity .2s}
#soldov.on{opacity:1}
#soldov .sb{background:#050813e6;border:3px solid var(--tc,var(--gold));border-radius:14px;padding:18px 34px;text-align:center;transform:rotate(-3deg);max-width:94vw}
#soldov .sb h3{margin:0;font:800 clamp(60px,12vw,130px)/.9 var(--display);color:var(--gold);letter-spacing:.06em}
#soldov .sb p{margin:6px 0 0;font:800 clamp(20px,3.5vw,38px) var(--display);letter-spacing:.04em;text-transform:uppercase}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#0b1226;padding:9px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:92vw}
#toast[hidden]{display:none}
@media (max-width:1250px){.paddles{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr) minmax(250px,40%)}.host{grid-column:1/-1;flex-direction:row;padding:6px 10px}.host svg{flex:none;width:54px;height:54px}.host .bubble{flex:1;max-height:3.9em}}
@media (max-width:640px){
  body{font-size:14px}
  .stage{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto;align-content:start}
  .stage>.panel{padding:8px 10px}
  .lot{flex-direction:column;gap:4px}.pname{font-size:clamp(26px,9vw,40px)}
  .base{margin-top:0}
  .bidtop{gap:10px}.ring{width:70px}
  .pad{padding:4px 6px}.pad .ow,.pad .ct{display:none}.pad .nm{font-size:16px}.pad .badge{display:none}
  .who span{max-width:46vw}.top h1{font-size:21px}.bidbtn{font-size:24px;min-height:50px}
}
@media (max-height:640px) and (max-width:640px){.host{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<div id="app">
  <header class="top">
    <h1>GC<b>SPL</b> Auction</h1>
    <span class="sp"></span>
    <div class="who"><i class="dot" id="dot"></i><span id="whoTxt">Local</span></div>
    <button class="menu" id="bMenu" aria-label="Open menu"><i></i><i></i><i></i></button>
  </header>

  <section class="stage">
    <div class="panel host" id="host">
      <svg viewBox="0 0 200 210" aria-label="Auctioneer Mam" role="img">
        <ellipse cx="80" cy="205" rx="70" ry="10" fill="#0003"/>
        <circle cx="80" cy="22" r="17" fill="#1c1320"/>
        <ellipse cx="80" cy="70" rx="45" ry="52" fill="#1c1320"/>
        <path d="M30 210 C30 160 55 148 80 148 C105 148 130 160 130 210Z" fill="#7a1f3d"/>
        <path d="M62 150 L80 185 L98 150 Z" fill="#f2b632"/>
        <path d="M30 210 C30 190 38 170 52 160 L60 210Z" fill="#f2b632" opacity=".85"/>
        <rect x="68" y="124" width="24" height="28" rx="8" fill="#c98a66"/>
        <ellipse cx="80" cy="84" rx="32" ry="38" fill="#d9a27c"/>
        <path d="M46 78 C46 44 64 38 80 38 C98 38 114 46 114 78 C104 62 92 56 80 56 C66 56 54 62 46 78Z" fill="#1c1320"/>
        <circle cx="48" cy="96" r="3.5" fill="#f2b632"/><circle cx="112" cy="96" r="3.5" fill="#f2b632"/>
        <ellipse class="eye" cx="67" cy="82" rx="3.6" ry="4.4" fill="#1c1320"/><ellipse class="eye" cx="93" cy="82" rx="3.6" ry="4.4" fill="#1c1320"/>
        <path d="M60 73 Q67 69 74 73M86 73 Q93 69 100 73" stroke="#1c1320" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <circle cx="80" cy="68" r="2.2" fill="#d6283a"/>
        <path d="M80 86 L77 100 L83 100" stroke="#b9794f" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <ellipse class="mouth" cx="80" cy="113" rx="8" ry="3.6" fill="#8a2336"/>
        <g class="gavel"><rect x="146" y="150" width="9" height="46" rx="3" fill="#8b5a2b"/><rect x="132" y="140" width="38" height="16" rx="4" fill="#b8793a"/></g>
        <rect x="118" y="194" width="56" height="9" rx="3" fill="#5a3a1a"/>
      </svg>
      <div class="bubble" id="bubble" aria-live="polite">Welcome!</div>
    </div>
    <div class="panel lot" id="lot"></div>
    <div class="panel bidbox" id="bidbox"></div>
  </section>

  <section class="paddles" id="paddles"></section>
  <section class="bar" id="bar"></section>
</div>

<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-label="Menu">
  <div class="dh"><h2>Menu</h2><button class="btn" id="bClose">Close</button></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="dbody"></div>
</aside>

<div id="splash" hidden><div class="card" id="splashCard"></div></div>
<div id="modal" hidden><div class="card" id="modalCard"></div></div>
<div id="soldov"><div class="sb"><h3>SOLD!</h3><p id="soldTxt"></p></div></div>
<canvas id="confetti"></canvas>
<div id="toast" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const fmt = L => L>=100 ? '₹'+(L%100===0 ? L/100 : (L/100).toFixed(2))+' Cr' : '₹'+L+' L';
const fmtS = L => '₹'+(+(L/100).toFixed(2))+'Cr';
const spoken = L => { const c=Math.floor(L/100), l=L%100; return [c?c+' crore':'', l?l+' lakh':''].filter(Boolean).join(' ') };
const inc = L => L<100?5 : L<200?10 : L<500?20 : 25;
const sayTeam = c => c.split('').join(' ');

/* ---------- roles & connection ---------- */
let socket=null, ME=null, IS_HOST=false, LIVEMODE=true, netState='connecting', PRES={}, HOST_ONLINE=false, CRED=null, hostReady=false;   // netState: connecting | live | error
let lastSend=0;
const DEV = (()=>{ try{ return Object.assign({voice:true,sfx:true},JSON.parse(localStorage.getItem(DKEY)||'{}')) }catch(e){ return {voice:true,sfx:true} } })();
const saveDev = () => { try{ localStorage.setItem(DKEY,JSON.stringify(DEV)) }catch(e){} };

/* ---------- state ---------- */
function fresh(){
  const queues={}; SETORDER.forEach(k=>queues[k]=shuffle(PLAYERS.filter(p=>p.set===k).map(p=>p.id)));
  return {v:2,phase:'main',setIdx:0,queues,accel:[],cur:null,sold:[],unsold:[],
    teams:Object.fromEntries(TEAMS.map(t=>[t.c,{purse:PURSE,squad:[]}])),
    settings:{os:true,auto:true,secs:7,ai:{}}};
}
let S = fresh();
let tab='teams', selTeam='RCB', drawerOpen=false, dl=0, tickSay={}, aiVal={}, lastAI=0, poolQ='', poolSet='', poolSt='';
let LIVE_SAY=null, LIVE_SALE=null, rev=0, seenSay=null, seenSale=null, gotMain=false, gotLive=false;
function loadLocal(){ try{ const r=localStorage.getItem(KEY); if(!r) return null; const s=JSON.parse(r); if(s&&s.v===2&&s.teams) return s }catch(e){} return null }
function saveLocal(){ if(!IS_HOST) return; try{ if(S.cur&&!S.cur.paused&&S.cur.bids.length) S.cur.remain=Math.max(0,dl-Date.now()); localStorage.setItem(KEY,JSON.stringify(S)) }catch(e){} }

/* ---------- team math ---------- */
const squadP = c => S.teams[c].squad.map(x=>P(x.pid));
const osCount = c => squadP(c).filter(p=>p.nation!=='India').length;
const roleCount = (c,r) => squadP(c).filter(p=>p.role===r).length;
const maxBid = c => { const t=S.teams[c]; return t.purse - MINBASE*Math.max(0,MINSQ-1-t.squad.length) };
function lockReason(c){ const t=S.teams[c]; if(t.squad.length>=MAXSQ) return 'Squad full'; if(maxBid(c)<MINBASE) return 'Purse locked'; return '' }
function bidReason(c,amt,p){
  const r=lockReason(c); if(r) return r;
  if(amt>maxBid(c)) return 'Max bid '+fmt(maxBid(c));
  if(S.settings.os && p.nation!=='India' && osCount(c)>=OSMAX) return 'Overseas 8/8';
  return '';
}
const leader = () => S.cur && S.cur.bids.length ? S.cur.bids[S.cur.bids.length-1] : null;
const nextAmt = () => { const l=leader(); return l ? l.amt+inc(l.amt) : P(S.cur.pid).base };
const myTeam = () => IS_HOST ? undefined : (ME||undefined);

/* ---------- voice, sfx ---------- */
let VOICE=null;
function pickVoice(){ if(!('speechSynthesis' in window)) return; const v=speechSynthesis.getVoices();
  VOICE = v.find(x=>/en[-_]IN/i.test(x.lang)&&/female|heera|neerja|veena|swara|google/i.test(x.name)) || v.find(x=>/en[-_]IN/i.test(x.lang)) || v.find(x=>/hi[-_]IN/i.test(x.lang)) || v.find(x=>/en/i.test(x.lang)&&/female|zira|samantha|google/i.test(x.name)) || null }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice }
let talkT;
function localSay(t,brief){
  $('#bubble').textContent=t; const h=$('#host'); h.classList.add('talk'); clearTimeout(talkT); talkT=setTimeout(()=>h.classList.remove('talk'),Math.min(6000,900+t.length*55));
  if(!DEV.voice||!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(brief||t); u.lang=VOICE?VOICE.lang:'en-IN'; if(VOICE)u.voice=VOICE; u.rate=1.03; u.pitch=1.15; u.onend=()=>h.classList.remove('talk'); speechSynthesis.speak(u) }catch(e){}
}
function say(t,brief){ localSay(t,brief); if(IS_HOST){ LIVE_SAY={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),text:t,brief:brief||t}; push('live') } }
let AC; const ac=()=>{ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume() }catch(e){} return AC };
function tone(f1,f2,d,type,v){ if(!DEV.sfx) return; const a=ac(); if(!a) return; const o=a.createOscillator(),g=a.createGain(),n=a.currentTime; o.type=type; o.frequency.setValueAtTime(f1,n); o.frequency.exponentialRampToValueAtTime(f2,n+d); g.gain.setValueAtTime(v,n); g.gain.exponentialRampToValueAtTime(.001,n+d); o.connect(g); g.connect(a.destination); o.start(n); o.stop(n+d) }
function noise(d,v,fc,swell){ if(!DEV.sfx) return; const a=ac(); if(!a) return; const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0); for(let i=0;i<x.length;i++) x[i]=Math.random()*2-1;
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=fc; const g=a.createGain(),n=a.currentTime;
  if(swell){ g.gain.setValueAtTime(.001,n); g.gain.linearRampToValueAtTime(v,n+d*.35); g.gain.linearRampToValueAtTime(.001,n+d) } else { g.gain.setValueAtTime(v,n); g.gain.exponentialRampToValueAtTime(.001,n+d) }
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(n) }
const sfxBid = () => tone(520,760,.09,'square',.12);
const sfxGavel = () => { tone(220,50,.18,'triangle',.9); noise(.08,.7,1800); setTimeout(()=>{tone(200,45,.2,'triangle',1); noise(.1,.8,1500)},240) };
const sfxCheer = () => noise(1.8,.5,1100,true);
const cv=$('#confetti'), cx=cv.getContext('2d'); let parts=[], raf=0;
function confetti(col){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width=innerWidth; cv.height=innerHeight; const cols=[col,'#f2b632','#ffffff','#3ddc97','#4cc9f0'];
  parts=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*15-3,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  cancelAnimationFrame(raf); const t0=performance.now();
  (function step(now){ cx.clearRect(0,0,cv.width,cv.height); parts.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
    if(now-t0<2800) raf=requestAnimationFrame(step); else cx.clearRect(0,0,cv.width,cv.height) })(t0);
}
let toastT; function toast(m){ const e=$('#toast'); e.textContent=m; e.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>e.hidden=true,2600) }
function soldFx(pid,team,price){
  const tm=T(team), ov=$('#soldov'); ov.style.setProperty('--tc',tm.col); $('#soldTxt').textContent=P(pid).name+' → '+team+' · '+fmt(price);
  ov.classList.add('on'); setTimeout(()=>ov.classList.remove('on'),2600);
  const h=$('#host'); h.classList.remove('hit'); void h.offsetWidth; h.classList.add('hit'); setTimeout(()=>h.classList.remove('hit'),1100);
  sfxGavel(); setTimeout(sfxCheer,350); confetti(tm.col);
}

/* ---------- sync (host writes, everyone reads) ---------- */
const W={main:{busy:false,pend:false},live:{busy:false,pend:false}};
const clean = o => JSON.parse(JSON.stringify(o));
function mainDoc(){ return clean({v:2,phase:S.phase,setIdx:S.setIdx,queues:S.queues,accel:S.accel,sold:S.sold,unsold:S.unsold,teams:S.teams,settings:S.settings}) }
function liveDoc(){ return clean({cur:S.cur?{pid:S.cur.pid,bids:S.cur.bids,paused:!!S.cur.paused,remain:S.cur.paused?(S.cur.remain||0):0}:null,t:Date.now(),deadline:dl,say:LIVE_SAY,sale:LIVE_SALE,rev:++rev}) }
function push(name){
  if(!IS_HOST||!socket||!socket.connected) return; const w=W[name]; if(w.busy){ w.pend=true; return } w.busy=true;
  (async()=>{ do{ w.pend=false; try{ await new Promise((res,rej)=>{ const t=setTimeout(()=>rej(new Error('timeout')),8000); socket.emit('host:push',{name,doc:name==='main'?mainDoc():liveDoc()},r=>{ clearTimeout(t); r&&r.ok?res():rej(new Error('rejected')) }) }); if(netState==='error'){netState='live';renderHeader()} }catch(e){ netState='error'; renderHeader(); console.warn('sync',e&&e.code) } }while(w.pend); w.busy=false })();
}
function commit(m,l){ saveLocal(); if(m) push('main'); if(l) push('live') }

/* player side: apply snapshots */
function applyMain(d){
  ['phase','setIdx','queues','accel','sold','unsold','teams','settings'].forEach(k=>{ if(d[k]!==undefined) S[k]=d[k] });
  gotMain=true; renderAll();
}
function applyLive(d){
  const prevPid=S.cur&&S.cur.pid, prevN=S.cur?S.cur.bids.length:0;
  S.cur=d.cur?{pid:d.cur.pid,bids:d.cur.bids||[],paused:d.cur.paused,remain:d.cur.remain}:null;
  dl = S.cur&&!S.cur.paused&&S.cur.bids.length ? Date.now()+(d.deadline-d.t) : 0;
  const first=!gotLive; gotLive=true;
  if(first){ seenSay=d.say&&d.say.id; seenSale=d.sale&&d.sale.id }
  else {
    if(d.say&&d.say.id!==seenSay){ seenSay=d.say.id; localSay(d.say.text,d.say.brief) }
    if(d.sale&&d.sale.id!==seenSale){ seenSale=d.sale.id; soldFx(d.sale.pid,d.sale.team,d.sale.price) }
    else if(S.cur&&S.cur.pid===prevPid&&S.cur.bids.length>prevN) sfxBid();
  }
  tickSay={}; renderAll();
}

/* ---------- auction flow (host) ---------- */
function nextPlayer(){
  if(!IS_HOST) return;
  if(S.cur){ toast('Finish the current player first (Sold or Unsold).'); return }
  let pid=null;
  if(S.phase==='main'){
    while(S.setIdx<SETORDER.length && !S.queues[SETORDER[S.setIdx]].length) S.setIdx++;
    if(S.setIdx>=SETORDER.length){ S.phase = S.unsold.length ? 'main_end' : 'done' } else pid=S.queues[SETORDER[S.setIdx]].pop();
  } else if(S.phase==='accel'){ if(S.accel.length) pid=S.accel.pop(); else S.phase='done' }
  if(pid===null){
    commit(1,1); renderAll();
    if(S.phase==='main_end') say('All sets are done. '+S.unsold.length+' players are unsold. Start the accelerated auction when you are ready.');
    else say('The auction is complete. Thank you everyone!');
    return;
  }
  const p=P(pid);
  S.cur={pid,bids:[],paused:false,remain:S.settings.secs*1000}; dl=0; tickSay={}; aiVal={}; computeAI();
  commit(1,1); renderAll(); const lot=$('#lot'); lot.classList.remove('pop'); void lot.offsetWidth; lot.classList.add('pop');
  say('Next up, '+p.name+', '+RL[p.role]+' '+(p.nation==='India'?'from India':'from '+p.nation)+'. Base price '+spoken(p.base)+'. Who will start the bidding?');
}
function placeBid(c,quiet){
  if(!IS_HOST||!S.cur) return; const l=leader(); if(l&&l.t===c) return;
  const amt=nextAmt(), p=P(S.cur.pid), why=bidReason(c,amt,p);
  if(why){ if(!quiet) toast(c+': '+why); return }
  S.cur.bids.push({t:c,amt}); S.cur.paused=false; dl=Date.now()+S.settings.secs*1000; tickSay={};
  saveLocal(); renderAll(); sfxBid();
  say(c+' bids '+fmt(amt)+'.', spoken(amt)+', '+sayTeam(c)+'.'); push('live');
}
function undoBid(){
  if(!IS_HOST||!S.cur||!S.cur.bids.length) return; S.cur.bids.pop(); tickSay={};
  dl = S.cur.bids.length ? Date.now()+S.settings.secs*1000 : 0;
  saveLocal(); renderAll(); say('Bid withdrawn.'); push('live');
}
function togglePause(){
  if(!IS_HOST||!S.cur||!S.cur.bids.length) return;
  if(S.cur.paused){ S.cur.paused=false; dl=Date.now()+S.cur.remain } else { S.cur.remain=Math.max(0,dl-Date.now()); S.cur.paused=true }
  commit(0,1); renderAll();
}
function sell(){
  if(!IS_HOST) return; const l=leader(); if(!S.cur||!l){ toast('There are no bids yet.'); return }
  const p=P(S.cur.pid), t=S.teams[l.t];
  t.purse-=l.amt; t.squad.push({pid:p.id,price:l.amt});
  if(S.sold.length) delete S.sold[S.sold.length-1].bids;
  S.sold.push({pid:p.id,team:l.t,price:l.amt,round:S.phase==='accel'?'Accelerated':p.setName,bids:S.cur.bids.slice()});
  S.unsold=S.unsold.filter(x=>x!==p.id);
  S.cur=null; dl=0;
  LIVE_SALE={id:Date.now()+'-'+p.id,pid:p.id,team:l.t,price:l.amt}; seenSale=LIVE_SALE.id;
  soldFx(p.id,l.t,l.amt); renderAll();
  say('Sold! '+p.name+' goes to '+l.t+', '+T(l.t).o+', for '+fmt(l.amt)+'.', 'Sold! '+p.name+' goes to '+sayTeam(l.t)+' for '+spoken(l.amt)+'!');
  commit(1,1);
}
function markUnsold(){
  if(!IS_HOST||!S.cur) return; if(S.cur.bids.length){ toast('A bid is already placed. Undo the bid first.'); return }
  const id=S.cur.pid; if(!S.unsold.includes(id)) S.unsold.push(id);
  S.cur=null; dl=0; renderAll(); sfxGavel(); say('No bids. '+P(id).name+' goes unsold.'); commit(1,1);
}
function undoSale(){
  if(!IS_HOST) return;
  if(S.cur){ toast('Finish the current player before undoing a sale.'); return }
  const s=S.sold.pop(); if(!s){ toast('There is no sale to undo.'); return }
  const t=S.teams[s.team]; t.squad=t.squad.filter(x=>x.pid!==s.pid); t.purse+=s.price;
  S.cur={pid:s.pid,bids:s.bids||[],paused:true,remain:S.settings.secs*1000}; dl=0; aiVal={};
  if(s.round==='Accelerated') S.phase='accel'; else if(S.phase==='done') S.phase='main_end';
  renderAll(); say('Sale reversed. '+P(s.pid).name+' is back on the block. Resume the timer when ready.'); commit(1,1);
}
function startAccel(){ if(!IS_HOST) return; S.phase='accel'; S.accel=shuffle(S.unsold); renderAll(); say('Accelerated auction begins with '+S.accel.length+' players.'); commit(1,1) }

/* AI franchises (host only) */
function computeAI(){
  if(!S.cur) return; const p=P(S.cur.pid); const hi=p.base>=200?5.5:p.base>=150?3.5:p.base>=100?3:2.4;
  TEAMS.forEach(t=>{ if(!S.settings.ai[t.c]) return; const sq=S.teams[t.c].squad.length;
    const need=roleCount(t.c,p.role)<NEED[p.role]?1.35:.6; const v=p.base*(1+Math.random()*(hi-1))*need;
    const cap=Math.max(p.base,(S.teams[t.c].purse-MINBASE*Math.max(0,MINSQ-1-sq))*(sq<MINSQ?.3:.2));
    aiVal[t.c]=Math.round(Math.min(v,cap,maxBid(t.c))/5)*5 });
}
function aiTick(){
  if(!S.cur||S.cur.paused) return; const n=nextAmt(), p=P(S.cur.pid), l=leader();
  const c=shuffle(TEAMS.filter(t=>S.settings.ai[t.c]&&!PRES[t.c]&&(!l||l.t!==t.c)&&aiVal[t.c]!==undefined&&aiVal[t.c]>=n&&!bidReason(t.c,n,p)));
  if(c.length&&Math.random()<.55) placeBid(c[0].c,true);
}

/* requests from players (host) */
function handleReq(team,d){
  if(!hostReady||!T(team)||!S.cur||S.cur.paused) return;
  if(S.cur.pid!==d.pid||nextAmt()!==d.amt) return;
  placeBid(team,true);
}

/* ---------- player actions ---------- */
function playerBid(){
  const t=myTeam(); if(!t||!S.cur||!socket) return;
  if(!HOST_ONLINE){ toast('The host is offline.'); return }
  const amt=nextAmt(), why=bidReason(t,amt,P(S.cur.pid)), l=leader();
  if(why){ toast(why); return } if(l&&l.t===t) return;
  if(Date.now()-lastSend<400) return; lastSend=Date.now(); sfxBid();
  socket.emit('bid',{pid:S.cur.pid,amt},r=>{ if(r&&!r.ok) toast(r.error==='host-offline'?'The host is offline.':'Your bid was not accepted.') });
}

/* ---------- timer loop ---------- */
setInterval(()=>{
  if(!S.cur) return; const b=S.cur.bids.length, secs=S.settings.secs;
  let rem = !b ? secs*1000 : S.cur.paused ? (S.cur.remain||0) : dl-Date.now();
  if(IS_HOST && b && !S.cur.paused){
    if(rem<=secs*1000*2/3 && !tickSay.once){ tickSay.once=1; const l=leader(); say('Going once at '+fmt(l.amt)+' to '+l.t+'.','Going once, '+spoken(l.amt)+', '+sayTeam(l.t)); tone(400,380,.12,'sine',.2) }
    if(rem<=secs*1000/3 && !tickSay.twice){ tickSay.twice=1; say('Going twice...','Going twice.'); tone(400,340,.14,'sine',.25) }
    if(rem<=0 && S.settings.auto){ sell(); return }
  }
  paintTimer(Math.max(0,rem));
  if(IS_HOST && !S.cur.paused && Date.now()-lastAI>1100){ lastAI=Date.now(); aiTick() }
},100);
function paintTimer(rem){
  const fg=$('#ringfg'); if(!fg||!S.cur) return; const secs=S.settings.secs, b=S.cur.bids.length;
  const f=b?Math.min(1,rem/(secs*1000)):1; fg.style.strokeDashoffset=(1-f)*289;
  $('#ringtxt').textContent = b ? Math.ceil(rem/1000) : '–';
  let cls='status',tx=b?'Bidding open':'Waiting for first bid';
  if(b){ if(S.cur.paused) tx='Timer paused'; else if(rem<=secs*1000/3){cls+=' twice';tx='Going twice...'} else if(rem<=secs*1000*2/3){cls+=' once';tx='Going once...'} }
  const st=$('#status'); st.className=cls; st.textContent=tx;
}

/* ---------- render ---------- */
const badge = c => '<span class="badge" style="background:'+T(c).col+'">'+c.slice(0,4)+'</span>';
function renderAll(){ renderHeader(); renderLot(); renderBid(); renderPaddles(); renderBar(); if(drawerOpen) renderDrawer() }
function renderHeader(){
  const dot=$('#dot'); dot.className='dot'+(netState==='live'?' on':netState==='error'?' err':'');
  const n=Object.keys(PRES).filter(k=>PRES[k]>0).length; let t;
  if(netState==='connecting') t='Connecting...'; else if(netState==='error') t='Connection lost. Reconnecting...';
  else if(IS_HOST) t='LIVE · Host · '+n+'/10 owners online';
  else { const m=myTeam(); t = m ? (HOST_ONLINE?'LIVE · ':'Host offline · ')+m+' ('+T(m).o+')' : (HOST_ONLINE?'LIVE · Watching':'Host offline · Watching') }
  $('#whoTxt').textContent=t;
}
function renderLot(){
  const el=$('#lot');
  if(!S.cur){
    let h='Ready for the next lot', sub=IS_HOST?'Press Next Player. A random player is drawn from the current set.':'The host will draw the next player. Get ready.';
    if(S.phase==='main_end'){ h='Main auction complete'; sub=S.unsold.length+' players are unsold.' }
    if(S.phase==='done'){ h='Auction complete'; sub='Open Menu > Teams to see the squads.' }
    const k=SETORDER[Math.min(S.setIdx,SETORDER.length-1)]; let left=0; for(let i=S.setIdx;i<SETORDER.length;i++) left+=S.queues[SETORDER[i]].length;
    el.innerHTML='<div class="empty"><b>'+h+'</b><span>'+sub+'</span>'+(S.phase==='main'?'<span class="num">Up next: '+(k[0]==='M'?'Marquee '+k.slice(1):'Set '+k.slice(1))+' · '+left+' players left · '+S.sold.length+' sold</span>':'')+
      (IS_HOST&&S.phase==='main_end'&&S.unsold.length?'<div><button class="btn pri" data-act="accel">Accelerated Auction ('+S.unsold.length+')</button></div>':'')+'</div>'; return }
  const p=P(S.cur.pid), os=p.nation!=='India', left=S.phase==='accel'?S.accel.length:(S.queues[p.set]||[]).length;
  el.innerHTML='<div class="lotset"><span>'+(S.phase==='accel'?'Accelerated round':p.setName)+'</span><span class="num">#'+p.id+' · '+left+' left in set</span></div>'+
    '<h2 class="pname">'+esc(p.name)+'</h2>'+
    '<div class="tags"><span class="tag '+(os?'os':'in')+'">'+NC[p.nation]+(os?' · Overseas':' · Indian')+'</span><span class="tag">'+RL[p.role]+'</span></div>'+
    '<div class="base"><small>Base price</small><strong class="num">'+fmt(p.base)+'</strong></div>';
}
function renderBid(){
  const el=$('#bidbox');
  if(!S.cur){ el.innerHTML='<div class="empty"><b>No live bid</b><span>Steps: ₹30L–1Cr +5L, ₹1–2Cr +10L, ₹2–5Cr +20L, ₹5Cr+ +25L.</span></div>'; return }

function rr(x,px,py,w,h,r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath() }
function fit(x,txt,maxW){ if(x.measureText(txt).width<=maxW) return txt; while(txt.length>1&&x.measureText(txt+'…').width>maxW) txt=txt.slice(0,-1); return txt+'…' }
async function makePoster(){
  try{ await Promise.all([document.fonts.load('800 60px "Big Shoulders Display"'),document.fonts.load('600 24px Hind')]) }catch(e){}
  const DISP='"Big Shoulders Display","Arial Narrow",Impact,sans-serif', BODY='Hind,"Segoe UI",system-ui,sans-serif';

  const maxN=Math.max(MINSQ,...TEAMS.map(t=>S.teams[t.c].squad.length));
  const RH=36, HEAD=132, FOOT=100, CH=HEAD+maxN*RH+FOOT+16, TOP=210, H=TOP+2*CH+GAP+M+10;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#16224a'); g.addColorStop(.35,'#0a0f1e'); g.addColorStop(1,'#080c18'); x.fillStyle=g; x.fillRect(0,0,W,H);
  const gl=x.createRadialGradient(W/2,0,50,W/2,0,900); gl.addColorStop(0,'rgba(242,182,50,.22)'); gl.addColorStop(1,'rgba(242,182,50,0)'); x.fillStyle=gl; x.fillRect(0,0,W,520);
  let sold=0, spent=0; TEAMS.forEach(t=>{ sold+=S.teams[t.c].squad.length; spent+=PURSE-S.teams[t.c].purse });
  x.textBaseline='alphabetic'; x.textAlign='left';
  x.fillStyle='#f2b632'; x.font='800 112px '+DISP; x.fillText('GCSPL MEGA AUCTION',M,118);
  x.fillStyle='#8d9ac0'; x.font='600 30px '+BODY; x.fillText('FINAL SQUADS  ·  10 TEAMS  ·  ₹120 CR PURSE EACH  ·  '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}).toUpperCase(),M,168);
  x.textAlign='right'; x.fillStyle='#eef1fa'; x.font='800 64px '+DISP; x.fillText(sold+' PLAYERS SOLD',W-M,100);
  x.fillStyle='#8d9ac0'; x.font='600 30px '+BODY; x.fillText('TOTAL SPENT '+fmt(spent),W-M,150); x.textAlign='left';
  TEAMS.forEach((t,i)=>{ const col=i%COLS, row=Math.floor(i/COLS); drawCard(x,t,M+col*(CW+GAP),TOP+row*(CH+GAP),CW,CH,HEAD,RH,FOOT,DISP,BODY) });
  return c;
}
function drawCard(x,t,px,py,CW,CH,HEAD,RH,FOOT,DISP,BODY){
    const tm=S.teams[t.c];
    x.save(); rr(x,px,py,CW,CH,22); x.fillStyle='#121a30'; x.fill(); x.strokeStyle='#26335a'; x.lineWidth=2; x.stroke(); x.clip();
    x.fillStyle=t.col; x.fillRect(px,py,CW,HEAD);
    x.fillStyle='rgba(0,0,0,.14)'; x.beginPath(); x.moveTo(px+CW*.62,py); x.lineTo(px+CW,py); x.lineTo(px+CW,py+HEAD); x.lineTo(px+CW*.52,py+HEAD); x.closePath(); x.fill();
    x.fillStyle='#0b0f1e'; x.font='800 76px '+DISP; x.fillText(t.c,px+24,py+82);
    x.font='600 27px '+BODY; x.fillText('OWNER  '+t.o.toUpperCase(),px+26,py+118);
    x.textAlign='right'; x.font='800 46px '+DISP; x.fillText(fmt(tm.purse),px+CW-24,py+66); x.font='600 21px '+BODY; x.fillText('PURSE LEFT',px+CW-24,py+98); x.textAlign='left';
    const sq=tm.squad.slice().sort((a,b)=>b.price-a.price);
    sq.forEach((e,k)=>{ const p=P(e.pid), ry=py+HEAD+k*RH;
      if(k%2===0){ x.fillStyle='rgba(255,255,255,.035)'; x.fillRect(px,ry,CW,RH) }
      x.fillStyle='#5d6a92'; x.font='600 20px '+BODY; x.fillText(String(k+1).padStart(2,'0'),px+16,ry+25);
      x.fillStyle='#eef1fa'; x.font='600 25px '+BODY;
      const os=p.nation!=='India', price=fmt(e.price), tag=(os?'OS ':'')+RS[p.role];
      x.font='700 25px '+BODY; const pw=x.measureText(price).width; x.font='600 17px '+BODY; const tw=x.measureText(tag).width;
      x.font='600 25px '+BODY; x.fillStyle='#eef1fa'; x.fillText(fit(x,p.name,CW-52-16-pw-tw-34),px+52,ry+25);
      x.textAlign='right'; x.fillStyle='#f2b632'; x.font='700 25px '+BODY; x.fillText(price,px+CW-16,ry+25);
      x.fillStyle=os?'#ffb86b':'#6f7da8'; x.font='600 17px '+BODY; x.fillText(tag,px+CW-16-pw-14,ry+24); x.textAlign='left';
    });
    if(!sq.length){ x.fillStyle='#5d6a92'; x.font='600 26px '+BODY; x.fillText('No players bought yet',px+24,py+HEAD+46) }
    const fy=py+CH-FOOT; x.fillStyle='#0d1428'; x.fillRect(px,fy,CW,FOOT);
    x.fillStyle=sq.length>=MINSQ?'#3ddc97':'#ffb86b'; x.font='800 40px '+DISP; x.fillText('SQUAD '+sq.length+'/25',px+24,fy+46);

    x.fillStyle='#8d9ac0'; x.font='600 21px '+BODY; x.fillText('Overseas '+osCount(t.c)+'/8',px+24,fy+82);
    x.restore();
}

  if(mode==='host'){
    const had=S.sold.length||S.cur||S.setIdx>0;
    c.innerHTML='<h2>GC<b>SPL</b> Auction</h2><p>'+(had?'A saved auction was found: '+S.sold.length+' players sold. Resume it, or start a new one.':'10 teams, ₹120 Cr purse each, 18 to 25 players per squad. Owners cannot bid until you press the button below.')+'</p>'+
      '<div class="row"><button class="btn pri" data-act="start">'+(had?'Resume Auction':'Start Auction')+'</button>'+(had?'<button class="btn" data-act="reset">New auction</button>':'')+'</div><p class="hint">Click once so the browser allows Mam\'s voice and the sound effects.</p>';
    return;
  }
  c.innerHTML='<h2>GC<b>SPL</b> Auction</h2><p>Log in as a team owner to bid, or as the host to run the auction.</p>'+
    '<select id="loginRole" aria-label="Role"><option value="host">Auction Host</option>'+TEAMS.map(t=>'<option value="'+t.c+'"'+(ME===t.c?' selected':'')+'>'+t.c+' · '+t.o+'</option>').join('')+'</select>'+
    '<input type="password" id="loginPass" placeholder="Passcode" autocomplete="off" style="background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit">'+
    '<p id="loginErr" style="color:var(--bad);min-height:1.2em"></p>'+
    '<div class="row"><button class="btn pri" data-act="dologin">Log in</button><button class="btn" data-act="watch">Watch only</button></div>';
  setTimeout(()=>{ const i=$('#loginPass'); if(i) i.focus() },50);
}
function adoptHost(st){
  const d=st&&st.main;
  if(d&&d.v===2){
    S=Object.assign(fresh(),{phase:d.phase,setIdx:d.setIdx,queues:d.queues,accel:d.accel,sold:d.sold,unsold:d.unsold,teams:d.teams,settings:d.settings});
    const l=st.live&&st.live.cur; if(l) S.cur={pid:l.pid,bids:l.bids||[],paused:true,remain:l.paused?(l.remain||0):Math.max(0,st.live.deadline-st.live.t)};
    else S.cur=null;
  } else { const loc=loadLocal(); S = loc || fresh(); if(S.cur) S.cur.paused=S.cur.bids.length>0 }
  dl=0; LIVE_SAY=null; LIVE_SALE=null;
}
function doLogin(){
  const role=$('#loginRole').value, pass=$('#loginPass').value.trim(), err=$('#loginErr');
  if(!pass){ err.textContent='Enter the passcode.'; return }
  if(!socket||!socket.connected){ err.textContent='Not connected to the server yet. Try again in a moment.'; return }
  ac();
  socket.emit('login',{role,pass},r=>{
    if(!r||!r.ok){ err.textContent=(r&&r.error)||'Login failed.'; return }
    CRED={role,pass};
    if(r.role==='host'){ IS_HOST=true; ME=null; hostReady=false; adoptHost(r.state); renderAll(); renderSplash('host') }
    else { IS_HOST=false; ME=r.team; selTeam=ME; $('#splash').hidden=true; renderAll(); localSay('Welcome '+T(ME).o+'! Get ready to bid.') }
  });
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s); let x;
  if(x=g('[data-pad]')){ if(IS_HOST) placeBid(x.dataset.pad); else { selTeam=x.dataset.pad; openDrawer('squads') } }
  else if(x=g('[data-tab]')){ tab=x.dataset.tab; renderDrawer(true) }
  else if(x=g('[data-team]')){ selTeam=x.dataset.team; tab='squads'; renderDrawer(true) }
  else if(x=g('[data-tdl]')){ const [k,c]=x.dataset.tdl.split(':'); posterDownload(k,c) }
  else if(x=g('[data-sel]')){ selTeam=x.dataset.sel; renderDrawer(true) }
  else if(x=g('[data-dev]')){ const k=x.dataset.dev; DEV[k]=!DEV[k]; if(k==='voice'&&!DEV.voice) try{speechSynthesis.cancel()}catch(_){} saveDev(); renderDrawer(true) }
  else if(x=g('[data-set]')){ if(!IS_HOST) return; const k=x.dataset.set; S.settings[k]=!S.settings[k]; commit(1,0); renderDrawer(true) }
  else if(x=g('[data-ai]')){ if(!IS_HOST) return; const k=x.dataset.ai; S.settings.ai[k]=!S.settings.ai[k]; computeAI(); commit(1,0); renderDrawer(true); renderPaddles() }
  else if(x=g('[data-act]')){ act(x.dataset.act) }
  else if(g('#bMenu')) openDrawer(); else if(g('#bClose')||e.target.id==='scrim') closeDrawer();
});
function act(a){
  if(a==='next') nextPlayer(); else if(a==='sold') sell(); else if(a==='unsold') markUnsold(); else if(a==='pause') togglePause();
  else if(a==='undobid') undoBid(); else if(a==='undosale') undoSale(); else if(a==='accel') startAccel(); else if(a==='pbid') playerBid();
  else if(a==='png') posterDownload('png'); else if(a==='pdf') posterDownload('pdf');
  else if(a==='csv') download('gcspl-squads.csv',csv(),'text/csv'); else if(a==='json') download('gcspl-squads.json',JSON.stringify(exportRows(),null,2),'application/json');
  else if(a==='reset') resetFlow();
  else if(a==='full'){ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast('Full screen was blocked')) }catch(_){} }
  else if(a==='login'){ renderSplash() }
  else if(a==='dologin') doLogin();
  else if(a==='watch'){ ac(); $('#splash').hidden=true }
  else if(a==='start'){ ac(); $('#splash').hidden=true; if(S.cur&&S.cur.bids.length){ S.cur.paused=true } computeAI(); hostReady=true; commit(1,1); socket.emit('host:ready'); renderAll(); say(S.sold.length||S.cur?'Welcome back. We resume where we left off.':'Good evening everyone! Welcome to the Grand Cricket Simulation Premier League auction. Ten teams, one hundred twenty crore each. Let us begin!') }
}
document.addEventListener('change',e=>{ const i=e.target.id;
  if(i==='secsSel'&&IS_HOST){ S.settings.secs=+e.target.value; if(S.cur&&S.cur.bids.length&&!S.cur.paused) dl=Date.now()+S.settings.secs*1000; commit(1,1) }
  else if(i==='poolSet'){poolSet=e.target.value;renderPool()} else if(i==='poolSt'){poolSt=e.target.value;renderPool()} });
document.addEventListener('input',e=>{ if(e.target.id==='poolQ'){ poolQ=e.target.value; renderPool() } });
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='loginPass'){ doLogin(); return }
  if(e.key==='Escape'&&drawerOpen){ closeDrawer(); return }
  if(!IS_HOST||!$('#splash').hidden||!$('#modal').hidden||drawerOpen||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey) return;
  const k=e.key.toLowerCase();
  if(/^[0-9]$/.test(k)) placeBid(TEAMS[k==='0'?9:+k-1].c);
  else if(k==='n') nextPlayer(); else if(k==='s') sell(); else if(k==='u') markUnsold(); else if(k==='z') undoBid(); else if(k===' '){ e.preventDefault(); togglePause() }
});
function resetFlow(){
  const m=$('#modal'); $('#modalCard').innerHTML='<h2>Reset auction?</h2><p>All sold players, purses and squads will be deleted. This cannot be undone. Download the squads from the Squads tab first.</p><div class="row"><button class="btn bad" id="mYes">Yes, reset</button><button class="btn" id="mNo">Cancel</button></div>'; m.hidden=false;
  $('#mNo').onclick=()=>m.hidden=true;
  $('#mYes').onclick=()=>{ const keep=S.settings; S=fresh(); S.settings=keep; dl=0; LIVE_SALE=null; LIVE_SAY=null; hostReady=true; commit(1,1); socket.emit('host:ready'); m.hidden=true; $('#splash').hidden=true; renderAll(); say('Auction reset. Press Next Player to begin.') };
}

/* ---------- boot ---------- */
function boot(){
  renderAll(); renderSplash();
  socket=io({reconnectionDelayMax:4000});
  socket.on('connect',()=>{
    netState='live'; renderHeader();
    if(CRED){   // reconnect: log in again silently
      socket.emit('login',CRED,r=>{
        if(!r||!r.ok){ CRED=null; ME=null; IS_HOST=false; renderAll(); return }
        if(r.role==='host'){ IS_HOST=true; if(hostReady){ push('main'); push('live'); socket.emit('host:ready') } }
        else { IS_HOST=false; ME=r.team }
        renderAll();
      });
    }
  });
  socket.on('disconnect',()=>{ netState='error'; renderHeader() });
  socket.on('state:init',d=>{
    PRES=d.presence||{}; HOST_ONLINE=!!d.hostOnline;
    if(!IS_HOST){ if(d.main) applyMain(d.main); if(d.live) applyLive(d.live) }
    renderAll();
  });
  socket.on('state:main',d=>{ if(!IS_HOST) applyMain(d) });
  socket.on('state:live',d=>{ if(!IS_HOST) applyLive(d) });
  socket.on('presence',p=>{ PRES=p; renderHeader(); renderPaddles(); if(drawerOpen&&tab==='owners') renderDrawer(true) });
  socket.on('hostStatus',v=>{ HOST_ONLINE=!!v; renderAll() });
  socket.on('bid',m=>{ if(IS_HOST) handleReq(m.team,m) });
  socket.on('kicked',()=>{ IS_HOST=false; CRED=null; hostReady=false; renderAll(); toast('Someone else logged in as the host.'); renderSplash() });
}
window.addEventListener('beforeunload',saveLocal);
boot();
</script>

</body></html>
